version: 2

# Spec 1-01: weekly, grouped updates. Minor/patch bumps are grouped per
# ecosystem; majors are ignored until v1.0.0 is tagged (D-083).
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    # Majors are ignored until v1.0.0 is tagged and reviewed by hand afterwards (D-083)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      composer:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    # Majors are ignored until v1.0.0 is tagged and reviewed by hand afterwards (D-083)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    commit-message:
      prefix: "ci"
    # Majors are ignored until v1.0.0 is tagged and reviewed by hand afterwards (D-083)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      github-actions:
        patterns:
          - "*"
