version: 2

# Spec 1-01: weekly, grouped updates. Minor/patch bumps are grouped per
# ecosystem; majors arrive as individual PRs so they get a real review.
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    # Release freeze (D-031): majors are reviewed by hand after v1.0.0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      composer:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    # Release freeze (D-031): majors are reviewed by hand after v1.0.0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # @types/node stays on the Node 24 runtime line
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      npm:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    commit-message:
      prefix: "ci"
    # Release freeze (D-031): majors are reviewed by hand after v1.0.0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      github-actions:
        patterns:
          - "*"
