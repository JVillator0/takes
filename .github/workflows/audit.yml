name: audit

# D-083/D-085: Dependabot ignores majors until v1.0.0, so advisories fixed only in a
# major are surfaced here instead. Not a required check: a new advisory must
# never block an unrelated PR.

on:
  push:
    branches:
      - main
    paths:
      - composer.lock
      - package-lock.json
      - .github/workflows/audit.yml
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: false

env:
  PHP_VERSION: '8.5'
  NODE_VERSION: '24'

jobs:
  composer-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none

      - name: Composer audit
        run: composer audit --locked

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --include=dev --audit false

      - name: npm audit (shipped surface)
        run: npm audit --omit=dev --audit-level=high

      # D-085: picomatch has no patched release; the full audit (dev included)
      # is reported, not gated.
      - name: npm audit (full, informational)
        continue-on-error: true
        run: |
          set +e
          npm audit --audit-level=high > audit-full.txt 2>&1
          status=$?
          {
            echo '### Full npm audit (dev dependencies included)'
            echo
            echo "Exit code: $status"
            echo
            echo '```'
            cat audit-full.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
