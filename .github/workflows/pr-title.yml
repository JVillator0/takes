name: pr-title

# Spec 1-01 / D-039: the PR title becomes the squash commit, so it must be a
# Conventional Commit. Separate workflow so editing a title re-runs only this
# check and never cancels (or skips) the ci workflow's required jobs.

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check Conventional Commit title
        env:
          # Passed through env, never interpolated into the script (injection-safe).
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|chore|docs|test|refactor|ci|perf|build)(\([a-z0-9-]+\))?!?: .+'
          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title OK: $PR_TITLE"
          else
            echo "::error title=PR title is not a Conventional Commit::Got '$PR_TITLE'. Expected type(scope)?: summary, type in feat|fix|chore|docs|test|refactor|ci|perf|build, scope lowercase kebab-case."
            exit 1
          fi
